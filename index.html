<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>مصحفي</title>

  <!-- أيقونة التطبيق على شاشة الآيباد -->
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- فتح الموقع كتطبيق -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <!-- لون واجهة التطبيق -->
  <meta name="theme-color" content="#8f123f">

  <!-- التصميم -->
  <link rel="stylesheet" href="style.css">

  <!-- إعدادات الـ PWA -->
  <link rel="manifest" href="manifest.json">
</head>


<body>

  <main class="app">

    <!-- عنوان التطبيق -->
    <header class="header">
      <h1>مصحفي</h1>
    </header>


    <!-- المشغل الرئيسي -->
    <section class="player-card">

      <button
        id="mainPlayButton"
        class="main-play-button"
        aria-label="تشغيل أو إيقاف"
      >
        ▶
      </button>

      <div class="current-surah">
        <span id="currentSurahName">
          اختاري سورة
        </span>
      </div>

    </section>


    <!-- مشغل القرآن -->
    <audio
      id="quranAudio"
      preload="metadata"
    ></audio>


    <!-- زر إعداد الصوت
         سيظهر لك في البداية فقط -->
    <button
      id="setupAudioButton"
      type="button"
    >
      إعداد الصوت
    </button>


    <!-- اختيار مجلد ملفات الصوت -->
    <input
      id="audioFolderInput"
      type="file"
      accept="audio/mpeg,.mp3"
      webkitdirectory
      multiple
      hidden
    >


    <!-- جميع السور -->
    <section
      id="surahGrid"
      class="surah-grid"
    ></section>

  </main>


  <!-- JavaScript -->
  <script src="app.js"></script>

</body>

</html>
